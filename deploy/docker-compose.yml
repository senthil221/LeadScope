services:
  leadscope:
    image: deploy-leadscope
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: leadscope-app
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    mem_limit: 768m
    # Supabase's own network, so the server can reach it as supabase-envoy:8000
    # (SUPABASE_INTERNAL_URL) instead of out through the public hostname and
    # back. The browser still uses the public address.
    networks:
      - default
      - supabase
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  mobile-worker:
    image: deploy-leadscope
    container_name: leadscope-mobile-worker
    command: ["node", "scripts/mobile-worker.mjs"]
    env_file:
      - .env
    environment:
      MOBILE_WORKER_URL: http://leadscope:3000
    depends_on:
      leadscope:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - default
      - supabase
networks:
  default: {}
  supabase:
    external: true
    name: supabase_default
